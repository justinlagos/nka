<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource-variable/inter-tight/wght.css">
<script src="lib.js"></script><script src="homog.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;overflow:hidden;background:#11183a;font-family:"Inter Tight Variable",sans-serif;color:#fff}
.layer{position:absolute;inset:0;overflow:hidden}
.deck{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:hidden;background:#1b2554}
.sl{position:absolute;inset:0;background:#1b2554;overflow:hidden}
.sl .top{position:absolute;left:90px;right:90px;top:64px;display:flex;justify-content:space-between;font-size:22px;font-weight:500;color:#aab4e0}
.sl h1{position:absolute;left:90px;top:300px;font-size:150px;line-height:.92;font-weight:600;letter-spacing:-.04em}
.sl h2{position:absolute;left:90px;top:180px;font-size:96px;line-height:.98;font-weight:600;letter-spacing:-.035em;max-width:12ch}
.sl p{position:absolute;left:90px;top:440px;font-size:28px;line-height:1.45;color:#c9d0ef;max-width:30ch}
.arc{position:absolute;overflow:visible}
.apps{position:absolute;left:90px;right:90px;top:330px;bottom:90px;display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:26px}
.apps>div{position:relative;border-radius:18px;overflow:hidden}
.apps small{position:absolute;left:22px;bottom:18px;font-size:20px;font-weight:600}
.badge{background:#e9e4d6;display:grid;place-items:center}
.badge .card{width:200px;height:270px;border-radius:14px;background:#1b2554;position:relative;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.badge .card b{position:absolute;left:18px;bottom:24px;font-size:26px;font-weight:600;line-height:1.05}
.tote{background:#f2b632;display:grid;place-items:center}
.tote .bag{width:200px;height:220px;background:#f4efe3;border-radius:6px 6px 14px 14px;position:relative;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.18)}
.tote .bag::before{content:"";position:absolute;left:50px;top:-60px;width:100px;height:100px;border:10px solid #f4efe3;border-radius:50%;}
.stg{background:#0d1230}
.stg .scr{position:absolute;left:40px;right:40px;top:40px;height:200px;background:#2b3a9e;border-radius:6px;overflow:hidden}
.stg .scr b{position:absolute;left:24px;top:22px;font-size:30px;line-height:1;font-weight:600}
.ph{position:absolute;left:0;top:0;transform-origin:0 0}
.ph img{display:block;position:absolute;left:0;top:0}
.cap{position:absolute;left:56px;bottom:46px;color:#fff;font-weight:600;font-size:22px;padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.42)}
.endc{position:absolute;inset:0;background:#1b2554;display:grid;place-items:center;text-align:center}
.endc b{display:block;font-size:100px;font-weight:600;letter-spacing:-.04em}
.endc span{display:block;font-size:24px;font-weight:600;color:#f2b632;margin-top:14px}
</style></head><body>
<template id="deckT"><div class="deck">
 <div class="sl s1"><div class="top"><span>Northlight Summit</span><span>Identity proposal, round one</span></div>
  <h1>Northlight<br>Summit 2027</h1>
  <svg class="arc a1" style="left:900px;top:250px" width="700" height="700" viewBox="0 0 700 700"><path d="M40 700 A 330 330 0 0 1 700 700" fill="none" stroke="#f2b632" stroke-width="34" stroke-linecap="round"/></svg></div>
 <div class="sl s2"><div class="top"><span>Northlight Summit</span><span>The idea</span></div>
  <h2>First light over the city.</h2><p>The arc is the moment the light comes up. It frames every name, every stage and every badge.</p>
  <svg class="arc a2" style="left:820px;top:170px" width="700" height="620" viewBox="0 0 700 620"><line x1="0" y1="520" x2="700" y2="520" stroke="#3b4a8f" stroke-width="4"/><path d="M110 520 A 240 240 0 0 1 590 520" fill="none" stroke="#f2b632" stroke-width="30" stroke-linecap="round"/><circle cx="350" cy="520" r="10" fill="#fff"/></svg></div>
 <div class="sl s3"><div class="top"><span>Northlight Summit</span><span>Applications</span></div>
  <h2 style="top:150px">Built to travel.</h2>
  <div class="apps">
   <div class="badge"><div class="card"><svg style="position:absolute;left:-20px;top:30px" width="240" height="140" viewBox="0 0 240 140"><path d="M20 140 A 100 100 0 0 1 220 140" fill="none" stroke="#f2b632" stroke-width="18"/></svg><b>Ada<br>Obi</b></div><small style="color:#1b2554">Badge</small></div>
   <div class="tote"><div class="bag"><svg style="position:absolute;left:10px;top:70px" width="180" height="110" viewBox="0 0 180 110"><path d="M15 110 A 75 75 0 0 1 165 110" fill="none" stroke="#1b2554" stroke-width="16"/></svg></div><small style="color:#1b2554">Tote</small></div>
   <div class="stg"><div class="scr"><b>Northlight<br>Summit 2027</b><svg style="position:absolute;right:20px;bottom:-40px" width="260" height="200" viewBox="0 0 260 200"><path d="M10 200 A 120 120 0 0 1 250 200" fill="none" stroke="#f2b632" stroke-width="14"/></svg></div><small>Main stage</small></div>
  </div></div>
</div></template>
<div class="layer" id="A"></div>
<div class="layer" id="B"><div class="ph" id="pp"><img src="present-hole.webp" width="2816" height="1584"></div><span class="cap">Presented to the organisers</span></div>
<div class="layer" id="C"><img id="ci" src="../../public/gallery/badges.webp" style="position:absolute;left:0;top:0;width:1600px;height:900px;object-fit:cover;object-position:50% 60%;transform-origin:45% 60%"><span class="cap">Badges, programme and tote</span></div>
<div class="layer" id="D"><img id="di" src="../../public/gallery/stage.webp" style="position:absolute;left:0;top:0;width:1600px;height:900px;object-fit:cover;transform-origin:40% 35%"><span class="cap">On the main stage</span></div>
<div class="layer" id="E"><div class="endc"><div><b>Northlight Summit</b><span>Event identity and presentation · Studio concept by nka.studio</span></div></div></div>
<script>
const T=document.getElementById('deckT').content.firstElementChild;
const d1=T.cloneNode(true); document.getElementById('A').appendChild(d1);
const d2=T.cloneNode(true); const pp=document.getElementById('pp'); pp.insertBefore(d2,pp.firstChild);
d2.style.transformOrigin='0 0'; d2.style.transform=quadMatrix(1600,900,[[572,218],[1793,238],[1790,888],[577,891]]);
function arcLen(el){return el.getTotalLength();}
const prep=d=>{d.querySelectorAll('.arc path').forEach(p=>{const L=p.getTotalLength();p.dataset.L=L;p.style.strokeDasharray=L;});};
prep(d1);prep(d2);
function deck(d,t,slideT){ // slideT: times when slide 2 and 3 arrive
  const S=[...d.querySelectorAll('.sl')];
  const a=K.inOutQuart(K.seg(t,slideT[0],slideT[0]+.55)), b=K.inOutQuart(K.seg(t,slideT[1],slideT[1]+.55));
  S[0].style.transform='translateX('+(-100*a)+'%)';
  S[1].style.transform='translateX('+(100*(1-a)-100*b)+'%)';
  S[2].style.transform='translateX('+(100*(1-b))+'%)';
  const p1=d.querySelector('.a1 path'); p1.style.strokeDashoffset=p1.dataset.L*(1-K.outCubic(K.seg(t,.3,1.6)));
  const h1=d.querySelector('h1'); h1.style.opacity=K.seg(t,.1,.5); h1.style.transform='translateY('+(30*(1-K.outCubic(K.seg(t,.1,.7))))+'px)';
  const p2=d.querySelector('.a2 path'); p2.style.strokeDashoffset=p2.dataset.L*(1-K.outCubic(K.seg(t,slideT[0]+.3,slideT[0]+1.3)));
  d.querySelectorAll('.apps>div').forEach((x,i)=>{const e=K.outCubic(K.seg(t,slideT[1]+.35+i*.12,slideT[1]+.9+i*.12));x.style.opacity=e;x.style.transform='translateY('+(40*(1-e))+'px)';});
}
window.frame=function(t){
  K.show('#A',t,-1,4.0,.35); deck(d1,t,[1.7,2.9]);
  K.show('#B',t,3.8,7.6,.4); deck(d2,t-3.6+0.0,[1.2,2.5]);
  if(t<4.6){deck(d2,1.9,[9,9]);} // first slide fully drawn while fading in
  const z=1+.07*K.seg(t,3.8,7.6), sc=1600/2816*1.12*z; pp.style.transform='translate('+(800-1300*sc)+'px,'+(450-760*sc)+'px) scale('+sc+')';
  K.show('#C',t,7.4,9.9,.35); K.css('#ci',{transform:'scale('+(1.03+.07*K.seg(t,7.4,9.9))+')'});
  K.show('#D',t,9.7,12.2,.35); K.css('#di',{transform:'scale('+(1.02+.08*K.seg(t,9.7,12.2))+')'});
  K.show('#E',t,12.0,14,.3);
};
frame(0);
</script></body></html>
