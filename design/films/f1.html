<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource-variable/fraunces/full.css">
<link rel="stylesheet" href="node_modules/@fontsource-variable/inter-tight/wght.css">
<script src="lib.js"></script><script src="homog.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;overflow:hidden;background:#f3efe6;font-family:"Inter Tight Variable",sans-serif;color:#161616}
.layer{position:absolute;inset:0;overflow:hidden}
.serif{font-family:"Fraunces Variable",serif;font-variation-settings:"opsz" 144,"SOFT" 30}
/* scene A */
#A{background:#f3efe6}
.wall{position:absolute;left:0;right:0;bottom:0;height:0;background:#1f3d2b}
.Hm{position:absolute;left:640px;top:250px;width:320px;height:400px}
.Hm i{position:absolute;background:#1f3d2b;display:block}
.c1{left:0;bottom:0;width:86px;height:400px;transform-origin:50% 100%}
.c2{right:0;bottom:0;width:86px;height:400px;transform-origin:50% 100%}
.lin{left:0;top:160px;width:320px;height:70px}
.word{position:absolute;left:0;right:0;top:360px;text-align:center;font-size:150px;font-weight:500;letter-spacing:-.025em;color:#f3efe6;white-space:nowrap}
.word span{display:inline-block}
.sub{position:absolute;left:0;right:0;top:560px;text-align:center;font-size:24px;letter-spacing:.02em;color:#f2b8c6;font-weight:500}
.stack{position:absolute;left:90px;top:80px;font-size:96px;line-height:.82;color:#f2b8c6;font-weight:500}
/* scene B */
#B{background:#f3efe6}
.cols{position:absolute;left:120px;right:120px;bottom:0;top:0;display:flex;gap:22px;align-items:flex-end}
.col{flex:1;position:relative;border-radius:14px 14px 0 0;padding:28px;transform-origin:50% 100%}
.col b{display:block;font-size:30px;font-weight:600;letter-spacing:-.01em}
.col small{display:block;font-size:18px;margin-top:6px;opacity:.75;font-weight:500}
.spec{position:absolute;left:120px;top:90px;display:flex;gap:80px;align-items:flex-end}
.spec .aa{font-size:200px;line-height:.8;color:#1f3d2b}
.spec .aa2{font-family:"Inter Tight Variable";font-size:200px;line-height:.8;font-weight:500;letter-spacing:-.04em;color:#1f3d2b}
.spec em{display:block;font-style:normal;font-size:20px;margin-top:22px;color:#4d5a50;font-weight:500}
/* photos */
.ph{position:absolute;left:0;top:0;transform-origin:0 0}
.ph img{display:block;position:absolute;left:0;top:0}
.cap{position:absolute;left:56px;bottom:46px;color:#fff;font-weight:600;font-size:22px;padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.42)}
/* guideline pages */
.gl{position:absolute;left:0;top:0;width:1200px;height:900px;background:#f3efe6;overflow:hidden}
.pg{position:absolute;inset:0;padding:70px 80px}
.pg h3{font-size:22px;font-weight:600;color:#1f3d2b;display:flex;justify-content:space-between}
.pg h3 span{color:#8a8f86;font-weight:500}
.pg h2{font-size:80px;font-weight:500;letter-spacing:-.02em;color:#1f3d2b;margin-top:40px}
.cs{position:absolute;left:80px;right:80px;top:330px;bottom:80px;border-radius:16px;background:#1f3d2b;display:grid;place-items:center}
.cs .box{position:relative;padding:60px;border:2px dashed rgba(242,184,198,.7)}
.cs .box .stk{font-size:150px;line-height:.82;color:#f2b8c6;font-weight:500}
.cs .x{position:absolute;width:60px;height:60px;border:2px solid rgba(242,184,198,.45);display:grid;place-items:center;color:#f2b8c6;font-size:22px}
.sw{position:absolute;left:80px;right:80px;top:330px;bottom:80px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:16px}
.sw div{border-radius:16px;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;font-size:20px;font-weight:600}
.sg{position:absolute;left:80px;right:80px;top:330px;bottom:80px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
.sg div{background:#7f9e82;border-radius:10px;color:#f3efe6;font-size:40px;font-weight:500;padding:30px;writing-mode:vertical-rl;transform:rotate(180deg)}
.endc{position:absolute;inset:0;background:#1f3d2b;color:#f3efe6;display:grid;place-items:center;text-align:center}
.endc b{display:block;font-size:110px;font-weight:500;letter-spacing:-.02em}
.endc span{display:block;font-size:24px;font-weight:600;color:#f2b8c6;margin-top:14px}
</style></head><body>
<div class="layer" id="A"><div class="wall"></div>
 <div class="Hm"><i class="c1"></i><i class="c2"></i><i class="lin"></i></div>
 <div class="stack serif">H&amp;<br>Co</div>
 <div class="word serif"><span class="w1">Halden</span> <span class="w2">&amp; Co</span></div>
 <div class="sub">Architecture and interiors</div></div>
<div class="layer" id="B">
 <div class="spec"><div><div class="aa serif">Aa</div><em>Fraunces, for names and headlines</em></div><div><div class="aa2">Aa</div><em>Inter Tight, for everything else</em></div></div>
 <div class="cols">
  <div class="col" style="background:#1f3d2b;color:#f3efe6;flex:1.6"><b>Forest</b><small>#1F3D2B</small></div>
  <div class="col" style="background:#7f9e82;color:#f3efe6"><b>Sage</b><small>#7F9E82</small></div>
  <div class="col" style="background:#f2b8c6;color:#1f3d2b"><b>Blush</b><small>#F2B8C6</small></div>
  <div class="col" style="background:#e4ddcc;color:#1f3d2b"><b>Linen</b><small>#E4DDCC</small></div>
  <div class="col" style="background:#161616;color:#f3efe6"><b>Ink</b><small>#161616</small></div></div></div>
<div class="layer" id="C"><img id="ci" src="../../public/gallery/identity.webp" style="position:absolute;left:0;top:0;width:1600px;height:900px;object-fit:cover;transform-origin:50% 45%"><span class="cap">Stationery set</span></div>
<div class="layer" id="D"><div class="ph" id="tp"><img src="tablet-hole.webp" width="2368" height="1776"></div><span class="cap">Brand guidelines</span></div>
<div class="layer" id="E"><img id="ei" src="../../public/gallery/signage.webp" style="position:absolute;left:0;top:0;width:1600px;height:900px;object-fit:cover;transform-origin:30% 50%"><span class="cap">Wayfinding for the studio</span></div>
<div class="layer" id="F"><div class="endc"><div><b class="serif">Halden &amp; Co</b><span>Brand identity · Studio concept by nka.studio</span></div></div></div>
<template id="glT"><div class="gl">
 <div class="pg p1"><h3>Halden &amp; Co brand guidelines<span>02 Logo</span></h3><h2 class="serif">Give it room.</h2>
  <div class="cs"><div class="box"><div class="stk serif">H&amp;<br>Co</div></div></div></div>
 <div class="pg p2"><h3>Halden &amp; Co brand guidelines<span>03 Colour</span></h3><h2 class="serif">Forest leads.</h2>
  <div class="sw"><div style="background:#1f3d2b;color:#f3efe6">Forest</div><div style="background:#7f9e82;color:#f3efe6">Sage</div><div style="background:#f2b8c6;color:#1f3d2b">Blush</div><div style="background:#e4ddcc;color:#1f3d2b">Linen</div></div></div>
 <div class="pg p3"><h3>Halden &amp; Co brand guidelines<span>07 Signage</span></h3><h2 class="serif">Signs read upward.</h2>
  <div class="sg"><div>Studios</div><div>Café</div><div>Meeting rooms</div></div></div>
</div></template>
<script>
const gl=document.getElementById('glT').content.firstElementChild.cloneNode(true);
const tp=document.getElementById('tp'); tp.insertBefore(gl,tp.firstChild);
gl.style.transformOrigin='0 0'; gl.style.transform=quadMatrix(1200,900,[[889,404],[1862,551],[1652,1374],[688,1161]]);
const pages=[...gl.querySelectorAll('.pg')];
window.frame=function(t){
  // A: monogram builds, then the forest wall rises and the wordmark lands
  K.show('#A',t,-1,4.5,.3);
  const r1=K.outQuint(K.seg(t,.15,.9)), r2=K.outQuint(K.seg(t,.35,1.1)), l=K.outBack(K.seg(t,1.0,1.55));
  K.css('.c1',{transform:'scaleY('+r1+')'}); K.css('.c2',{transform:'scaleY('+r2+')'});
  K.css('.lin',{transform:'translateY('+(-260*(1-l))+'px)',opacity:K.seg(t,1.0,1.1)});
  const w=K.inOutQuart(K.seg(t,1.9,2.6)); K.css('.wall',{height:(w*100)+'%'});
  const hm=K.inOutCubic(K.seg(t,1.8,2.15)); K.css('.Hm',{opacity:1-hm,transform:'translateY('+(-60*hm)+'px) scale('+(1-.15*hm)+')'});
  K.css('.w1',{opacity:K.seg(t,2.4,2.8),transform:'translateY('+(40*(1-K.outCubic(K.seg(t,2.4,2.9))))+'px)'});
  K.css('.w2',{opacity:K.seg(t,2.6,3.0),transform:'translateY('+(40*(1-K.outCubic(K.seg(t,2.6,3.1))))+'px)'});
  K.css('.sub',{opacity:K.seg(t,3.1,3.5)});
  K.css('.stack',{opacity:K.seg(t,3.3,3.7),transform:'translateX('+(-30*(1-K.outCubic(K.seg(t,3.3,3.8))))+'px)'});
  
  // B: palette columns rise to different heights, type specimen above
  K.show('#B',t,4.3,6.9,.3);
  const hs=[560,470,400,340,290];
  K.$$('.col').forEach((c,i)=>{const e=K.outQuint(K.seg(t,4.4+i*.09,5.3+i*.09));c.style.height=(hs[i]*e)+'px';});
  K.css('.spec',{opacity:K.seg(t,5.1,5.5),transform:'translateY('+(30*(1-K.outCubic(K.seg(t,5.1,5.7))))+'px)'});
  // C: stationery photo, revealed by a column wipe
  K.show('#C',t,6.7,9.0,.01);
  const cw=K.inOutQuart(K.seg(t,6.7,7.3)); K.css('#C',{clipPath:'inset(0 '+(100-cw*100)+'% 0 0)'});
  K.css('#ci',{transform:'scale('+(1.04+.06*K.seg(t,6.7,9.0))+')'});
  K.show('#C .cap',t,7.2,8.9,.25);
  // D: guidelines on a tablet
  K.show('#D',t,8.8,11.6,.35);
  const z=1+.06*K.seg(t,8.8,11.6), sc=1600/2368*1.05*z; tp.style.transform='translate('+(800-1270*sc)+'px,'+(450-900*sc)+'px) scale('+sc+')';
  const ft=t-8.8; pages.forEach((p,i)=>{const a=K.inOutCubic(K.seg(ft,.9*i-.1,.9*i+.3)), b=K.inOutCubic(K.seg(ft,.9*(i+1)-.1,.9*(i+1)+.3));
    const x=i==0?(-100*b):(i==2?100*(1-a):(100*(1-a)-100*b)); p.style.transform='translateX('+x+'%)';});
  // E: wayfinding
  K.show('#E',t,11.4,13.3,.35); K.css('#ei',{transform:'scale('+(1.02+.07*K.seg(t,11.4,13.3))+')'});
  K.show('#F',t,13.1,15,.3);
};
frame(0);
</script></body></html>
